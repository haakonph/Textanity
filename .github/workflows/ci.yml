name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CI: 'true'
      NX_DAEMON: 'false'
      DATABASE_URL: postgresql://textanity:textanity@127.0.0.1:5432/textanity_test
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: textanity
          POSTGRES_PASSWORD: textanity
          POSTGRES_DB: textanity_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U textanity -d textanity_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run db:migrate
      - run: npm run test:integration
      - run: npm run build
